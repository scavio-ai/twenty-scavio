# Publishes to npm with provenance when main carries a version that is not
# on npm yet. Provenance ties the package to this public repo, which is what
# the Twenty marketplace claim flow checks.
name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Skip if this version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on npm"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update npm
        if: steps.check.outputs.publish == 'true'
        run: npm install -g npm@latest

      - name: Install Twenty CLI
        if: steps.check.outputs.publish == 'true'
        run: npm install -g twenty@2.58.0

      - name: Install dependencies
        if: steps.check.outputs.publish == 'true'
        run: yarn install --immutable

      - name: Lint, typecheck and unit tests
        if: steps.check.outputs.publish == 'true'
        run: yarn lint && yarn typecheck && yarn test:unit

      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: twenty app publish
